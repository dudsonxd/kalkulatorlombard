<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICKLE PAWN & CO. — Rejestr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE3CC;
    --paper-dark: #E2D5B8;
    --ink: #2A241C;
    --ink-soft: #5A5142;
    --green: #2F4A34;
    --green-dark: #1B2B1F;
    --brass: #B08D3F;
    --brass-light: #D4B876;
    --red: #8B3A3A;
    --line: rgba(42,36,28,0.18);
  }

  *{ box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    color:var(--paper);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    background:
      linear-gradient(180deg, rgba(10,14,10,0.88) 0%, rgba(10,14,10,0.93) 55%, rgba(6,10,6,0.97) 100%),
      url('assets/pickle-logo-bg.jpg') center top / 900px auto no-repeat fixed,
      #0c120d;
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  header{
    text-align:center;
    padding-bottom:22px;
    margin-bottom:28px;
    border-bottom:3px double var(--brass-light);
  }

  header .mark{ font-size:28px; }

  h1{
    font-family:'Special Elite', monospace;
    font-size:clamp(28px, 5vw, 40px);
    letter-spacing:1px;
    color:var(--brass-light);
    margin:6px 0 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .tagline{
    font-size:14px;
    color:var(--paper);
    opacity:0.75;
    font-style:italic;
  }

  section{ margin-bottom:26px; }

  .panel{
    background:rgba(237,227,204,0.96);
    color:var(--ink);
    border:1px solid rgba(176,141,63,0.5);
    border-radius:3px;
    padding:20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }

  .panel h2{
    font-family:'Special Elite', monospace;
    font-size:15px;
    margin:0;
    color:var(--green-dark);
  }

  .summary-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px;
  }

  @media (max-width:640px){
    .summary-grid{ grid-template-columns: 1fr; }
  }

  .stat{
    text-align:center;
    padding:10px 6px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{ border-right:none; }
  @media (max-width:640px){
    .stat{ border-right:none; border-bottom:1px solid var(--line); padding-bottom:14px; }
    .stat:last-child{ border-bottom:none; }
  }

  .stat .num{
    font-family:'Special Elite', monospace;
    font-size:26px;
    color:var(--green-dark);
    display:block;
  }
  .stat .lbl{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }

  .ledger-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }

  .add-tile-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--green);
    color:var(--paper);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .add-tile-btn:hover{ background:var(--green-dark); transform: scale(1.06); }
  .add-tile-btn:active{ transform: scale(0.96); }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-style:italic;
    border:1px dashed var(--line);
    grid-column: 1 / -1;
  }

  .tile-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }

  @media (max-width:680px){
    .tile-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width:420px){
    .tile-grid{ grid-template-columns: 1fr; }
  }

  .tile{
    position:relative;
    background:var(--paper);
    border:1px solid rgba(42,36,28,0.25);
    border-radius:3px;
    padding:14px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:6px;
    box-shadow: 2px 2px 0 rgba(42,36,28,0.08);
  }

  .tile-num{
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:var(--brass);
  }

  .tile-name{
    font-weight:700;
    font-size:15px;
    line-height:1.25;
  }

  .tile-cat{
    align-self:flex-start;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--green-dark);
    background:rgba(47,74,52,0.12);
    padding:2px 7px;
    border-radius:20px;
  }

  .tile-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
    flex:1;
  }

  .tile-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }

  .tile-price{
    font-family:'Special Elite', monospace;
    font-size:16px;
    color:var(--green-dark);
  }

  .tile-del{
    background:none;
    border:none;
    color:var(--red);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .tile-del:hover{ color:#601f1f; }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:var(--paper);
    opacity:0.65;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,14,10,0.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-backdrop.open{ display:flex; }

  .modal{
    background:var(--paper);
    color:var(--ink);
    width:100%;
    max-width:420px;
    border-radius:3px;
    padding:22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    border:1px solid rgba(176,141,63,0.5);
  }

  .modal h2{
    font-family:'Special Elite', monospace;
    font-size:16px;
    color:var(--green-dark);
    margin:0 0 16px;
  }

  .field{ margin-bottom:12px; }

  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }

  input, select, textarea{
    width:100%;
    font-family:'Source Sans 3', sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--ink-soft);
    border-radius:2px;
    background:#fff;
    color:var(--ink);
  }

  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }

  textarea{ resize:vertical; min-height:44px; }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }

  .btn{
    flex:1;
    padding:11px;
    border:none;
    border-radius:2px;
    font-family:'Special Elite', monospace;
    font-size:13px;
    letter-spacing:0.4px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--green); color:var(--paper); }
  .btn-primary:hover{ background:var(--green-dark); }
  .btn-secondary{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-secondary:hover{ background:rgba(0,0,0,0.05); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">🥒</div>
    <h1>PICKLE PAWN &amp; CO.</h1>
    <div class="tagline">rejestr skupu — South Central</div>
  </header>

  <section class="panel">
    <h2>Podsumowanie</h2>
    <div class="summary-grid" style="margin-top:16px;">
      <div class="stat">
        <span class="num" id="stat-total">$0</span>
        <span class="lbl">Wartość łączna</span>
      </div>
      <div class="stat">
        <span class="num" id="stat-count">0</span>
        <span class="lbl">Pozycji w rejestrze</span>
      </div>
      <div class="stat">
        <span class="num" id="stat-avg">$0</span>
        <span class="lbl">Średnia cena</span>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="ledger-head">
      <h2>Rejestr przedmiotów</h2>
      <button type="button" class="add-tile-btn" id="open-modal" aria-label="Dodaj pozycję" title="Dodaj pozycję">+</button>
    </div>
    <div id="ledger-list" class="tile-grid"></div>
  </section>

  <footer>PICKLE PAWN &amp; CO. — dane zapisywane lokalnie w tej przeglądarce</footer>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2>Nowa pozycja</h2>
    <form id="item-form">
      <div class="field">
        <label for="f-name">Nazwa przedmiotu</label>
        <input id="f-name" type="text" placeholder="np. Zegarek kieszonkowy" required>
      </div>
      <div class="field">
        <label for="f-desc">Opis / uwagi</label>
        <textarea id="f-desc" placeholder="stan, historia, szczegóły..."></textarea>
      </div>
      <div class="field">
        <label for="f-cat">Kategoria</label>
        <select id="f-cat">
          <option>Biżuteria</option>
          <option>Elektronika</option>
          <option>Broń</option>
          <option>Pojazdy</option>
          <option>Kolekcjonerskie</option>
          <option>Inne</option>
        </select>
      </div>
      <div class="field">
        <label for="f-price">Cena skupu ($)</label>
        <input id="f-price" type="number" min="0" step="1" placeholder="0" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="close-modal">Anuluj</button>
        <button type="submit" class="btn btn-primary">Dodaj</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'picklePawnLedger';

function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

function saveItems(items){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

let items = loadItems();

const form = document.getElementById('item-form');
const nameInput = document.getElementById('f-name');
const descInput = document.getElementById('f-desc');
const catInput = document.getElementById('f-cat');
const priceInput = document.getElementById('f-price');
const listEl = document.getElementById('ledger-list');
const statTotal = document.getElementById('stat-total');
const statCount = document.getElementById('stat-count');
const statAvg = document.getElementById('stat-avg');

const backdrop = document.getElementById('modal-backdrop');
const openBtn = document.getElementById('open-modal');
const closeBtn = document.getElementById('close-modal');

function openModal(){
  backdrop.classList.add('open');
  nameInput.focus();
}
function closeModal(){
  backdrop.classList.remove('open');
  form.reset();
}

openBtn.addEventListener('click', openModal);
closeBtn.addEventListener('click', closeModal);
backdrop.addEventListener('click', (e) => {
  if(e.target === backdrop) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && backdrop.classList.contains('open')) closeModal();
});

function money(n){
  return '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function render(){
  const total = items.reduce((sum, it) => sum + Number(it.price || 0), 0);
  const count = items.length;
  const avg = count ? total / count : 0;

  statTotal.textContent = money(total);
  statCount.textContent = count;
  statAvg.textContent = money(avg);

  if(count === 0){
    listEl.innerHTML = '<div class="empty">Rejestr jest pusty. Kliknij „+", żeby dodać pierwszą pozycję.</div>';
    return;
  }

  listEl.innerHTML = items.map((it, idx) => {
    const num = String(idx + 1).padStart(3, '0');
    return `
      <div class="tile" data-id="${it.id}">
        <div class="tile-num">#${num}</div>
        <div class="tile-name">${escapeHtml(it.name)}</div>
        <div class="tile-cat">${escapeHtml(it.category)}</div>
        ${it.desc ? `<div class="tile-desc">${escapeHtml(it.desc)}</div>` : ''}
        <div class="tile-bottom">
          <span class="tile-price">${money(it.price)}</span>
          <button type="button" class="tile-del" data-id="${it.id}">Usuń</button>
        </div>
      </div>
    `;
  }).join('');
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const price = parseFloat(priceInput.value);
  if(!name || isNaN(price)) return;

  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name,
    desc: descInput.value.trim(),
    category: catInput.value,
    price
  });

  saveItems(items);
  render();
  closeModal();
});

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.tile-del');
  if(!btn) return;
  const id = btn.dataset.id;
  items = items.filter(it => it.id !== id);
  saveItems(items);
  render();
});

render();
</script>
</body>
</html>
